name: wp-sync
version: 1.0.0
description: APM project for wp-sync
author: hiroya-akeoka
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
  - claude
  - cursor
dependencies:
  apm:
    - hiroya232/agent-kit/plugins/core
    - hiroya232/agent-kit/plugins/dev
  mcp: []
includes: auto
scripts: {}
# AGENTS.md の apm:start/apm:end マーカー間だけを apm compile が書き換える。
# 値は managed_section で固定（ハイフン区切り等の誤記は無警告で full モードにフォールバックする）。
compilation:
  agents_md:
    mode: managed_section
