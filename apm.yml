$schema: https://microsoft.github.io/apm/specs/schemas/manifest-v0.1.schema.json
name: wp-sync
version: 1.0.0
description: APM project for wp-sync

targets:
  - claude

dependencies:
  apm:
    - microsoft/apm/packages/apm-guide
    - hiroya232/aidd/plugins/core
    - hiroya232/aidd/plugins/dev

includes: auto

# AGENTS.md の apm:start/apm:end マーカー間だけを apm compile が書き換える。
# 値は managed_section で固定（ハイフン区切り等の誤記は無警告で full モードにフォールバックする）。
compilation:
  agents_md:
    mode: managed_section
